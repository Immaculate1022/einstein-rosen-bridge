name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Compile all modules
        run: >-
          python -m compileall -q
          stabilized_bridge.py
          transit_analysis.py
          visualize_transit.py
          wormhole_transit.py
